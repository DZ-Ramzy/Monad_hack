[profile.default]
src = "contracts"
test = "test"
out = "forge-out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "shanghai"
optimizer = true
optimizer_runs = 200
verbosity = 2

# The gacha draws from a block hash that did not exist at commit time, so the
# tests lean on vm.roll and vm.setBlockhash. Keep fuzz runs high enough that the
# published odds are actually exercised.
[fuzz]
runs = 512

[profile.deep.fuzz]
runs = 20000
